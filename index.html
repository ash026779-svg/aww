<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>our little memories ♡</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #fff0f5;
  color: #773e57;
  font-family: "Trebuchet MS", sans-serif;
  height: 100dvh;
  overflow: hidden;
}

.screen {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

h1 { font-size: 28px; }
p { color: #a56b83; }

#lock input {
  width: 150px;
  padding: 14px;
  border: 2px solid #edb4cc;
  border-radius: 14px;
  background: white;
  color: #773e57;
  font-size: 26px;
  text-align: center;
  letter-spacing: 12px;
  outline: none;
}

button {
  border: none;
  border-radius: 14px;
  background: #e99bb9;
  color: white;
  padding: 13px 24px;
  margin-top: 15px;
  font-size: 16px;
  cursor: pointer;
}

#message {
  min-height: 24px;
  font-size: 14px;
}

#gallery {
  display: none;
  position: fixed;
  inset: 0;
  background: #241820;
  color: white;
  padding: 0;
}

#photo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  inset: 0;
  transition: opacity .25s;
}

#photo.fade { opacity: 0; }

#prev, #next {
  position: absolute;
  top: 0;
  height: 100%;
  width: 30%;
  background: transparent;
  margin: 0;
  border-radius: 0;
  z-index: 2;
  opacity: 0;
}

#prev { left: 0; }
#next { right: 0; }

#counter {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  padding: 8px 14px;
  border-radius: 20px;
  background: #241820aa;
  color: #ffe8f1;
  font-size: 13px;
}

#caption {
  position: absolute;
  top: 18px;
  left: 0;
  right: 0;
  z-index: 3;
  color: #ffe8f1;
  font-size: 13px;
  text-shadow: 0 1px 5px black;
  pointer-events: none;
}

#loading {
  position: absolute;
  align-self: center;
  color: #ffe8f1;
  padding: 20px;
}
</style>
</head>

<body>
<section class="screen" id="lock">
  <div style="font-size:42px">🎀</div>
  <h1>enter our secret code</h1>
  <p>let's see if you know me well enough ♡</p>

  <form id="codeForm">
    <input id="code" type="password"
      inputmode="numeric" pattern="[0-9]{3}"
      maxlength="3" placeholder="•••"
      aria-label="Enter three-digit code" required>
    <br>
    <button type="submit">unlock our memories ♡</button>
  </form>

  <p id="message"></p>
</section>

<section class="screen" id="gallery">
  <div id="loading">loading our memories ♡</div>
  <img id="photo" class="fade" alt="Our memory">
  <div id="caption">our little memories ♡</div>
  <button id="prev" aria-label="Previous photo"></button>
  <button id="next" aria-label="Next photo"></button>
  <div id="counter"></div>
</section>

<script>
// ✿ CHANGE THIS TO YOUR OWN THREE-DIGIT CODE
const SECRET_CODE = "482";

// ✿ ADD YOUR UPLOADED PHOTO LINKS HERE
const photos = [
  "PASTE-PHOTO-LINK-1-HERE",
  "PASTE-PHOTO-LINK-2-HERE",
  "PASTE-PHOTO-LINK-3-HERE"
];

const lock = document.getElementById("lock");
const gallery = document.getElementById("gallery");
const photo = document.getElementById("photo");
const loading = document.getElementById("loading");
const counter = document.getElementById("counter");
let current = 0;
let startX = 0;

document.getElementById("codeForm").addEventListener("submit", e => {
  e.preventDefault();

  if (document.getElementById("code").value === SECRET_CODE) {
    if (!photos.length || photos.some(p => p.startsWith("PASTE-"))) {
      document.getElementById("message").textContent =
        "The code is right! Add your photos to finish the gallery ♡";
      return;
    }

    lock.style.display = "none";
    gallery.style.display = "flex";
    showPhoto(0);
  } else {
    document.getElementById("message").textContent =
      "wrong code, try again! ♡";
    document.getElementById("code").value = "";
  }
});

function showPhoto(index) {
  current = (index + photos.length) % photos.length;
  photo.classList.add("fade");

  const img = new Image();
  img.onload = () => {
    photo.src = img.src;
    photo.classList.remove("fade");
    loading.style.display = "none";
    counter.textContent = `${current + 1} / ${photos.length}`;
  };
  img.onerror = () => {
    loading.style.display = "block";
    loading.textContent = "Couldn't load this photo. Check its link.";
  };
  img.src = photos[current];
}

document.getElementById("prev").onclick = () =>
  showPhoto(current - 1);

document.getElementById("next").onclick = () =>
  showPhoto(current + 1);

document.addEventListener("keydown", e => {
  if (gallery.style.display !== "flex") return;
  if (e.key === "ArrowLeft") showPhoto(current - 1);
  if (e.key === "ArrowRight") showPhoto(current + 1);
});

document.addEventListener("touchstart", e => {
  startX = e.changedTouches[0].clientX;
}, { passive: true });

document.addEventListener("touchend", e => {
  if (gallery.style.display !== "flex") return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 50) {
    showPhoto(current + (dx < 0 ? 1 : -1));
  }
}, { passive: true });
</script>
</body>
</html>
